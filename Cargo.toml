[package]
name = "securelinkageservice"
version = "0.0.1"
edition = "2021"
build = "build.rs"
license = "AGPL 3.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["json", "macros"] }
clap = { version = "4", features = ["std", "help", "derive", "env", "wrap_help", "color"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0", features = ["json", "default-tls"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi", "json"] }
tryhard = "0"

[build-dependencies]
build-data = "0"
