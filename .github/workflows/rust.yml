name: Build with Rust and Docker

on:
  push:
  workflow_dispatch:
  pull_request:

jobs:
  build-with-samply:
    uses: samply/github-workflows/.github/workflows/rust.yml@main
    with:
      # See https://github.com/samply/github-workflows/tree/main/.github/workflows/rust.yml
      # Docker Hub name will be {image-prefix}{component}.
      image-prefix: "samply/"
      components: '[ "secure-linkage-service" ]'
      architectures: '[ "amd64", "arm64" ]'
      ghcr-retention-policy: "keep"
      cargo-fmt-check: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
