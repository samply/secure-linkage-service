[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
  "OpenSSL",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "0BSD",
]

[sources.allow-org]
github = ["samply"]

[advisories]
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "no upstream fix for the rsa Marvin attack; beam needs rsa to build" },
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained but focus transitively depends on it" },
]

[[licenses.exceptions]]
crate = "secure-linkage-service"
allow = ["AGPL-3.0-or-later"]
